<title>미국장 브리핑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* 레이아웃: 국내 브리핑과 같은 체계. 시각 → 지수 띠 → 탭(주도섹터 / 시장 이슈) → 섹터(접힘) → 종목 → 한글 기사 시트 */
:root {
  --bg: #F3F4F6; --surface: #FFFFFF; --ink: #15171C; --muted: #6B717D; --rule: #E2E5EA;
  --up: #DE2338; --up-weak: #FCE4E7; --down: #2356C4; --down-weak: #E4EBFA;
  --scrim: rgba(15, 17, 21, .42);
  --font: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1014; --surface: #171A20; --ink: #ECEEF2; --muted: #8C93A0; --rule: #272B33;
    --up: #FF5A6D; --up-weak: rgba(255, 90, 109, .15); --down: #6592FF; --down-weak: rgba(101, 146, 255, .15);
    --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1014; --surface: #171A20; --ink: #ECEEF2; --muted: #8C93A0; --rule: #272B33;
  --up: #FF5A6D; --up-weak: rgba(255, 90, 109, .15); --down: #6592FF; --down-weak: rgba(101, 146, 255, .15);
  --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--down); outline-offset: 2px; border-radius: 4px; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 18px 10px; }
.clock { display: flex; align-items: flex-end; gap: 12px; }
.clock .t { font-size: 46px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
.clock .d { display: flex; flex-direction: column; padding-bottom: 4px; }
.clock .d b { font-size: 15px; font-weight: 600; }
.clock .d span { font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 4px; margin-top: 14px; background: var(--rule); padding: 3px; border-radius: 10px; }
.tabs button { flex: 1; padding: 9px 0; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); text-align: center; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* 지수 띠: 가로 스크롤 */
.indices { display: flex; gap: 8px; overflow-x: auto; margin-top: 14px; padding-bottom: 2px; scrollbar-width: none; }
.indices::-webkit-scrollbar { display: none; }
.ix { flex: 0 0 auto; background: var(--surface); border-radius: 12px; padding: 10px 12px; min-width: 112px; }
.ix small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; }
.ix b { display: block; font-size: 15px; font-weight: 700; margin-top: 2px; }
.ix span { font-size: 14px; font-weight: 700; }

.list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.sec { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; }
.sec-head { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; column-gap: 10px; align-items: center; padding: 14px 14px 12px; }
.rank { font-size: 26px; font-weight: 700; line-height: 1; align-self: start; padding-top: 2px; }
.sname-h { font-size: 17px; font-weight: 700; min-width: 0; }
.srate-h { font-size: 17px; font-weight: 700; }
.smeta { grid-column: 2 / 4; display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
.smeta b { color: var(--ink); font-weight: 600; }
.breadth { grid-column: 2 / 4; display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 9px; background: var(--down-weak); }
.breadth i { display: block; background: var(--up); }
.chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
.sec[data-open="true"] .chev { transform: rotate(180deg); }
.stocks { border-top: 1px solid var(--rule); padding: 6px 8px 10px; }
.stock { width: 100%; display: grid; grid-template-columns: 1fr auto; column-gap: 10px; padding: 10px 8px; border-radius: 10px; }
.stock:hover { background: var(--bg); }
.nm { font-size: 15.5px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm small { font-weight: 500; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
.rt { font-size: 15.5px; font-weight: 700; text-align: right; }
.hl { grid-column: 1 / 3; font-size: 12.5px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { grid-column: 1 / 3; display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--ink); white-space: nowrap; }

.news { background: var(--surface); border-radius: var(--r-lg); padding: 4px 14px; margin-top: 14px; }
.nitem { display: block; padding: 13px 0; border-top: 1px solid var(--rule); }
.nitem:first-child { border-top: 0; }
.nitem small { font-size: 12px; color: var(--muted); }
.nitem b { display: block; font-size: 15.5px; font-weight: 700; margin-top: 3px; text-wrap: pretty; }
.nitem p { margin: 5px 0 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.foot { font-size: 12px; color: var(--muted); margin-top: 22px; line-height: 1.7; }
.state { padding: 60px 0; text-align: center; color: var(--muted); }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 20px 20px 0 0; max-height: 85vh; overflow-y: auto;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up .25s cubic-bezier(.2,.7,.2,1); }
@keyframes up { from { transform: translateY(40px); opacity: .6; } }
.sheet-in { max-width: 560px; margin: 0 auto; }
.grab { width: 38px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto 12px; }
.sh-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.sh-head h2 { margin: 0; font-size: 21px; }
.sh-head .code { font-size: 12.5px; color: var(--muted); }
.sh-rate { font-size: 22px; font-weight: 700; }
.close { font-size: 13px; color: var(--muted); padding: 6px 10px; border: 1px solid var(--rule); border-radius: 999px; margin-top: 14px; }
.sub { font-size: 14px; font-weight: 700; margin: 16px 0 2px; }
.empty { font-size: 13.5px; color: var(--muted); padding: 10px 0; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .chev { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="clock"><div class="t num">07:00</div><div class="d"><b id="dateLabel">불러오는 중</b><span>한국 투자자 관심종목 기준</span></div></div>
    <div class="indices" id="indices"></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-sec" aria-selected="true" aria-controls="view-sec">주도섹터</button>
      <button role="tab" id="tab-news" aria-selected="false" aria-controls="view-news">시장 이슈</button>
    </div>
  </header>
  <main>
    <section id="view-sec" role="tabpanel" aria-labelledby="tab-sec">
      <div class="list" id="sectors"><div class="state">주도섹터를 불러오는 중</div></div>
      <div class="foot">
        <div>종목 범위: 키움 미국주식 조회순위 20 + 관심등록 상위 60 + 매수 상위 60 (ETF 제외)</div>
        <div>섹터 점수: 관심종목 수 50% + 등락률 중앙값 50%. 막대는 섹터 안 상승(빨강)과 하락(파랑) 종목 비율입니다.</div>
        <div>종목을 누르면 최신 한글 기사를 볼 수 있습니다.</div>
      </div>
    </section>
    <section id="view-news" role="tabpanel" aria-labelledby="tab-news" hidden>
      <div class="news" id="news"></div>
      <div class="foot">네이버 증권에 올라온 뉴욕증시 관련 한글 기사입니다. 누르면 원문이 열립니다.</div>
    </section>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shName" hidden></div>

<script>
(function () {
  const DATA_URL = "data/us-latest.json";
  const st = { data: null, open: new Set([1]) };
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pct = (v) => (v > 0 ? "+" : "") + Number(v).toFixed(2) + "%";
  const cls = (v) => v > 0 ? "up" : v < 0 ? "down" : "";
  const when = (dt) => dt ? `${+dt.slice(4, 6)}/${+dt.slice(6, 8)} ${dt.slice(8, 10)}:${dt.slice(10, 12)}` : "";
  const WD = "일월화수목금토";
  const tg = window.Telegram && window.Telegram.WebApp;

  function newsItem(n) {
    return `<a class="nitem" href="${esc(n.url)}" target="_blank" rel="noopener" data-url="${esc(n.url)}">
      <small>${esc(n.office)} · ${when(n.dt)}</small><b>${esc(n.title)}</b>${n.summary ? `<p>${esc(n.summary)}</p>` : ""}</a>`;
  }
  function ranks(s) { return Object.entries(s.ranks).sort((a, b) => a[1] - b[1]).map(([k, v]) => `<span class="tag num">${esc(k)} ${v}위</span>`).join(""); }

  function render() {
    const d = st.data;
    const y = +d.date.slice(0, 4), m = +d.date.slice(4, 6), day = +d.date.slice(6);
    $("#dateLabel").textContent = `${m}월 ${day}일 ${WD[new Date(y, m - 1, day).getDay()]}요일 미국장`;
    $("#indices").innerHTML = d.indices.map((x) => `<div class="ix num"><small>${esc(x.name)}</small><b>${esc(x.close)}</b><span class="${cls(x.rate)}">${pct(x.rate)}</span></div>`).join("");
    $("#sectors").innerHTML = d.sectors.map((s) => {
      const open = st.open.has(s.rank);
      const upW = s.count ? (s.rising / s.count) * 100 : 0;
      return `<article class="sec" data-open="${open}">
        <button class="sec-head" data-rank="${s.rank}" aria-expanded="${open}">
          <span class="rank num">${s.rank}</span><span class="sname-h">${esc(s.name)}</span><span class="srate-h num ${cls(s.rate)}">${pct(s.rate)}</span>
          <span class="smeta num"><span>관심종목 <b>${s.count}개</b></span><span>상승 <b>${s.rising}/${s.count}</b></span>
            <svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
          <span class="breadth" aria-hidden="true"><i style="width:${upW}%"></i></span>
        </button>
        ${open ? `<div class="stocks">${s.stocks.map((x) => `<button class="stock" data-code="${esc(x.code)}">
            <span class="nm">${esc(x.name)}<small>${esc(x.code)}</small></span><span class="rt num ${cls(x.rate)}">${pct(x.rate)}</span>
            ${x.news && x.news.length ? `<span class="hl">${esc(x.news[0].title)}</span>` : ""}
            <span class="tags">${ranks(x)}</span></button>`).join("")}</div>` : ""}
      </article>`;
    }).join("");
    $("#news").innerHTML = d.news.length ? d.news.map(newsItem).join("") : '<div class="empty">최근 36시간 안에 올라온 기사가 없습니다.</div>';
  }

  function find(code) { for (const s of st.data.sectors) for (const x of s.stocks) if (x.code === code) return [x, s]; return [null, null]; }
  let lastFocus = null;
  function openSheet(code) {
    const [x, s] = find(code); if (!x) return;
    lastFocus = document.activeElement;
    $("#sheet").innerHTML = `<div class="sheet-in"><div class="grab"></div>
      <div class="sh-head"><div><h2 id="shName">${esc(x.name)}</h2><div class="code">${esc(x.code)} · ${esc(s.name)} ${s.rank}위</div></div><div class="sh-rate num ${cls(x.rate)}">${pct(x.rate)}</div></div>
      <div class="tags" style="margin-top:10px">${ranks(x)}</div>
      <div class="sub">관련 한글 기사</div>
      ${x.news && x.news.length ? `<div>${x.news.map(newsItem).join("")}</div>` : '<div class="empty">최근 36시간 안에 올라온 기사가 없습니다.</div>'}
      <button class="close" id="closeSheet">닫기</button></div>`;
    $("#sheet").hidden = false; $("#scrim").hidden = false; document.body.style.overflow = "hidden"; $("#closeSheet").focus();
  }
  function closeSheet() { $("#sheet").hidden = true; $("#scrim").hidden = true; document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }

  document.addEventListener("click", (e) => {
    const link = e.target.closest("[data-url]");
    if (link && tg && tg.openLink) { e.preventDefault(); tg.openLink(link.dataset.url); return; }
    const h = e.target.closest(".sec-head");
    if (h) { const r = +h.dataset.rank; st.open.has(r) ? st.open.delete(r) : st.open.add(r); render(); return; }
    const s = e.target.closest(".stock");
    if (s) { openSheet(s.dataset.code); return; }
    if (e.target.closest("#closeSheet") || e.target.id === "scrim") { closeSheet(); return; }
    const tab = e.target.closest('[role="tab"]');
    if (tab) {
      const sec = tab.id === "tab-sec";
      $("#tab-sec").setAttribute("aria-selected", sec); $("#tab-news").setAttribute("aria-selected", !sec);
      $("#view-sec").hidden = !sec; $("#view-news").hidden = sec;
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

  if (tg) {
    try {
      tg.ready(); tg.expand();
      if (tg.colorScheme) document.documentElement.setAttribute("data-theme", tg.colorScheme);
      tg.onEvent && tg.onEvent("themeChanged", () => document.documentElement.setAttribute("data-theme", tg.colorScheme));
    } catch (e) {}
  }
  fetch(DATA_URL, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => { st.data = d; render(); })
    .catch(() => { $("#sectors").innerHTML = '<div class="state">미국장 데이터를 아직 받지 못했습니다. 아침 7시 이후에 다시 열어주세요.</div>'; });
})();
</script>
